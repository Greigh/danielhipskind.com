<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Contact Us - Adamas</title>
    <link rel="stylesheet" href="styles/main.css" />

    <!-- SEO & Open Graph -->
    <meta
      name="description"
      content="Contact Adamas support. We are here to help you with any questions or issues."
    />
    <meta
      name="keywords"
      content="contact, support, help, adamas, call center help"
    />
    <meta name="author" content="Daniel Hipskind" />

    <!-- Open Graph (Facebook/LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://danielhipskind.com/adamas/contact"
    />
    <meta property="og:title" content="Contact Us | Adamas" />
    <meta
      property="og:description"
      content="Get in touch with the Adamas team for support and inquiries."
    />
    <meta
      property="og:image"
      content="https://danielhipskind.com/adamas/og-image.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://danielhipskind.com/adamas/contact"
    />
    <meta property="twitter:title" content="Contact Us | Adamas" />
    <meta
      property="twitter:description"
      content="Get in touch with the Adamas team for support and inquiries."
    />
    <meta
      property="twitter:image"
      content="https://danielhipskind.com/adamas/og-image.png"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://danielhipskind.com/adamas/contact" />

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-content">
          <div class="app-title"><h1><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" width="22" height="22"><path fill="currentColor" d="M32 4L8 24l24 36 24-36L32 4zm0 10.5L46.5 26 32 48.2 17.5 26 32 14.5z"/></svg> <span class="brand-name">Adamas</span></h1></div>
          <nav class="main-nav">
            <a href="<%= htmlWebpackPlugin.files.publicPath %>" class="nav-tab"
              >Main</a
            >
            <a
              href="<%= htmlWebpackPlugin.files.publicPath %>privacy"
              class="nav-tab"
              >Privacy Policy</a
            >
            <a
              href="<%= htmlWebpackPlugin.files.publicPath %>terms"
              class="nav-tab"
              >Terms of Use</a
            >
            <a
              href="<%= htmlWebpackPlugin.files.publicPath %>contact"
              class="nav-tab"
              >Contact Us</a
            >
          </nav>
        </div>
      </header>
      <main class="container card themed-static-page max-w-600 auto-margin">
        <h2>Contact Us</h2>
        <form id="contact-form" autocomplete="on" novalidate>
          <div class="form-group">
            <label for="contact-name">Name</label>
            <input
              type="text"
              id="contact-name"
              name="name"
              required
              autocomplete="name"
            />
          </div>
          <div class="form-group">
            <label for="contact-email">Email</label>
            <input
              type="email"
              id="contact-email"
              name="email"
              required
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              rows="5"
              required
            ></textarea>
          </div>
          <div class="form-group">
            <div
              class="g-recaptcha"
              data-sitekey="6LdQ0hssAAAAAMWQrEq6044ftIH76l8pLAbHSjFx"
            ></div>
          </div>
          <button type="submit" class="button" id="contact-submit-btn">
            Send Message
          </button>
          <div id="contact-success" class="success-message"></div>
          <div id="contact-error" class="error-message"></div>
        </form>
        <script src="js/contact.js"></script>
      </main>
      <footer class="copyright-footer">
        <div class="container">
          <p>
            &copy; 2026 Daniel Hipskind.
            <a href="privacy">Privacy Policy</a> &bull;
            <a href="terms">Terms of Use</a> &bull;
            <a href="contact">Contact Us</a>
          </p>
        </div>
      </footer>
    </div>
    <script src="js/theme-init.js"></script>
  </body>
</html>
